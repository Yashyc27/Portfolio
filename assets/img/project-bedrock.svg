<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#1F1F24"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFDB6E"/>
      <stop offset="100%" stop-color="#FFBC5E"/>
    </linearGradient>
    <linearGradient id="awsGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad1)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600"/>
    <path d="M60 0 V380 M120 0 V380 M180 0 V380 M240 0 V380 M300 0 V380 M360 0 V380 M420 0 V380 M480 0 V380 M540 0 V380"/>
  </g>

  <!-- Tech glow orb -->
  <circle cx="300" cy="140" r="90" fill="#FFDB6E" opacity="0.06" filter="url(#glow1)"/>

  <!-- Architecture Visual: RAG Pipeline -->
  <!-- Document Ingestion Box -->
  <rect x="70" y="85" width="110" height="110" rx="10" fill="#25252B" stroke="#383842" stroke-width="1.5"/>
  <rect x="85" y="105" width="45" height="6" rx="3" fill="#FFDB6E" opacity="0.8"/>
  <rect x="85" y="120" width="80" height="4" rx="2" fill="#888899"/>
  <rect x="85" y="132" width="70" height="4" rx="2" fill="#888899"/>
  <rect x="85" y="144" width="75" height="4" rx="2" fill="#888899"/>
  <rect x="85" y="156" width="50" height="4" rx="2" fill="#888899"/>
  <text x="125" y="180" fill="#AAAAAA" font-family="'Poppins', sans-serif" font-size="10" text-anchor="middle" font-weight="500">Private Docs</text>

  <!-- Flow Arrow 1 -->
  <path d="M190 140 H235" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="235,136 243,140 235,144" fill="#FFBC5E"/>

  <!-- Amazon Bedrock Knowledge Base Central Node -->
  <rect x="245" y="70" width="130" height="140" rx="14" fill="#2A2A33" stroke="url(#accentGrad)" stroke-width="2"/>
  <circle cx="310" cy="115" r="24" fill="#1F1F24" stroke="#FFDB6E" stroke-width="2"/>
  <!-- Bedrock / Cloud Icon -->
  <path d="M302 120 C298 120 295 117 295 113 C295 110 297 107 300 106 C301 102 305 99 310 99 C315 99 319 102 320 106 C323 107 325 110 325 113 C325 117 322 120 318 120 Z" fill="url(#accentGrad)"/>
  <text x="310" y="158" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="12" text-anchor="middle" font-weight="600">Amazon Bedrock</text>
  <text x="310" y="174" fill="#FFDB6E" font-family="'Poppins', sans-serif" font-size="10" text-anchor="middle">Knowledge Bases RAG</text>
  <text x="310" y="195" fill="#888899" font-family="'Poppins', sans-serif" font-size="9" text-anchor="middle">Vector Embeddings</text>

  <!-- Flow Arrow 2 -->
  <path d="M385 140 H430" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="430,136 438,140 430,144" fill="#FFBC5E"/>

  <!-- Streamlit UI / Verified Response Box -->
  <rect x="440" y="85" width="110" height="110" rx="10" fill="#25252B" stroke="#383842" stroke-width="1.5"/>
  <rect x="455" y="102" width="60" height="8" rx="4" fill="#00D26A" opacity="0.8"/>
  <text x="485" y="108" fill="#000000" font-family="'Poppins', sans-serif" font-size="7" font-weight="700" text-anchor="middle">CITATION BACKED</text>
  <rect x="455" y="122" width="80" height="4" rx="2" fill="#DDDDDD"/>
  <rect x="455" y="132" width="75" height="4" rx="2" fill="#AAAAAA"/>
  <rect x="455" y="142" width="65" height="4" rx="2" fill="#AAAAAA"/>
  <text x="495" y="180" fill="#AAAAAA" font-family="'Poppins', sans-serif" font-size="10" text-anchor="middle" font-weight="500">Streamlit EC2</text>

  <!-- Badge Bar at bottom -->
  <rect x="30" y="240" width="540" height="110" rx="12" fill="#1C1C21" stroke="#303038" stroke-width="1"/>
  <text x="50" y="272" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="17" font-weight="600">Enterprise Knowledge Base Q&amp;A System</text>
  <text x="50" y="295" fill="#AAAAAA" font-family="'Poppins', sans-serif" font-size="12">Citation-backed, hallucination-resistant semantic vector search over enterprise documents</text>

  <!-- Stack Pills -->
  <g transform="translate(50, 312)">
    <rect x="0" y="0" width="105" height="24" rx="12" fill="#2C2C35"/>
    <text x="52" y="16" fill="#FFDB6E" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">Amazon Bedrock</text>

    <rect x="115" y="0" width="90" height="24" rx="12" fill="#2C2C35"/>
    <text x="160" y="16" fill="#E0E0E0" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">RAG Pipeline</text>

    <rect x="215" y="0" width="80" height="24" rx="12" fill="#2C2C35"/>
    <text x="255" y="16" fill="#E0E0E0" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">AWS EC2</text>

    <rect x="305" y="0" width="75" height="24" rx="12" fill="#2C2C35"/>
    <text x="342" y="16" fill="#E0E0E0" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">Streamlit</text>

    <rect x="390" y="0" width="115" height="24" rx="12" fill="#2C2C35"/>
    <text x="447" y="16" fill="#00E599" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Zero Hallucination</text>
  </g>
</svg>
