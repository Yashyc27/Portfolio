<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#1B2228"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E82EE"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FFDB6E"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFDB6E"/>
      <stop offset="100%" stop-color="#FFBC5E"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad2)"/>

  <!-- Subtle Chart Grid in Background -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <path d="M50 50 H550 M50 100 H550 M50 150 H550 M50 200 H550"/>
    <path d="M100 30 V220 M200 30 V220 M300 30 V220 M400 30 V220 M500 30 V220"/>
  </g>

  <!-- Financial Candlestick / Growth Trend Line -->
  <path d="M70 180 Q 140 160 210 120 T 350 90 T 450 65 T 530 45" fill="none" stroke="#00E599" stroke-width="2.5" opacity="0.6"/>
  <circle cx="530" cy="45" r="5" fill="#00E599" filter="url(#glow2)"/>

  <!-- Chat UI Frame -->
  <g transform="translate(100, 45)">
    <!-- Chat Container -->
    <rect width="400" height="175" rx="12" fill="#20232A" stroke="#333842" stroke-width="1.5"/>
    
    <!-- Chat Header -->
    <rect width="400" height="36" rx="12" fill="#282C35"/>
    <circle cx="20" cy="18" r="4" fill="#FF5F56"/>
    <circle cx="34" cy="18" r="4" fill="#FFBD2E"/>
    <circle cx="48" cy="18" r="4" fill="#27C93F"/>
    <text x="200" y="22" fill="#E0E0E0" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Financial Advisor AI ┬╖ Gemini + LangChain</text>
    <rect x="330" y="10" width="55" height="16" rx="8" fill="#00D26A" opacity="0.2"/>
    <text x="357" y="21" fill="#00E599" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">99.9% UPTIME</text>

    <!-- User bubble -->
    <rect x="180" y="50" width="205" height="32" rx="10" fill="#323846"/>
    <text x="192" y="66" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="9.5">Optimize portfolio risk vs inflation</text>
    <text x="192" y="77" fill="#888899" font-family="'Poppins', sans-serif" font-size="8">Multi-turn context stored</text>

    <!-- AI Bot bubble (RAG Grounded) -->
    <rect x="15" y="94" width="280" height="66" rx="10" fill="#2A2A34" stroke="url(#geminiGrad)" stroke-width="1"/>
    <!-- Gemini sparkle icon -->
    <path d="M30 106 Q 30 114 38 114 Q 30 114 30 122 Q 30 114 22 114 Q 30 114 30 106 Z" fill="url(#geminiGrad)"/>
    <text x="44" y="113" fill="#FFDB6E" font-family="'Poppins', sans-serif" font-size="9" font-weight="600">Grounded Advisor (LangChain RAG)</text>
    <text x="30" y="130" fill="#CCCCCC" font-family="'Poppins', sans-serif" font-size="9">Hedging 15% in sovereign bonds + equity index</text>
    <text x="30" y="145" fill="#888899" font-family="'Poppins', sans-serif" font-size="8">FastAPI microservice ┬╖ Low latency streaming</text>
  </g>

  <!-- Project Info Footer -->
  <rect x="30" y="240" width="540" height="110" rx="12" fill="#1C1C21" stroke="#303038" stroke-width="1"/>
  <text x="50" y="272" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="17" font-weight="600">Financial Advisor AI Chatbot</text>
  <text x="50" y="295" fill="#AAAAAA" font-family="'Poppins', sans-serif" font-size="12">Production LLM advisor with multi-turn memory, LangChain RAG &amp; zero-downtime CI/CD on AWS</text>

  <!-- Stack Pills -->
  <g transform="translate(50, 312)">
    <rect x="0" y="0" width="85" height="24" rx="12" fill="#2C2C35"/>
    <text x="42" y="16" fill="#FFDB6E" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">Gemini API</text>

    <rect x="95" y="0" width="90" height="24" rx="12" fill="#2C2C35"/>
    <text x="140" y="16" fill="#E0E0E0" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">LangChain</text>

    <rect x="195" y="0" width="70" height="24" rx="12" fill="#2C2C35"/>
    <text x="230" y="16" fill="#E0E0E0" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">FastAPI</text>

    <rect x="275" y="0" width="80" height="24" rx="12" fill="#2C2C35"/>
    <text x="315" y="16" fill="#E0E0E0" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">AWS EC2</text>

    <rect x="365" y="0" width="60" height="24" rx="12" fill="#2C2C35"/>
    <text x="395" y="16" fill="#E0E0E0" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">CI/CD</text>

    <rect x="435" y="0" width="105" height="24" rx="12" fill="#2C2C35"/>
    <text x="487" y="16" fill="#00E599" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Zero Downtime</text>
  </g>
</svg>
