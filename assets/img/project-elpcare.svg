      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#1C1826"/>
    </linearGradient>
    <linearGradient id="careGrad" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
