<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#1A2026"/>
    </linearGradient>
    <linearGradient id="mlopsGrad" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFDB6E"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>
    <linearGradient id="pipelineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D26A"/>
      <stop offset="50%" stop-color="#FFDB6E"/>
      <stop offset="100%" stop-color="#4E82EE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad3)"/>

  <!-- Pipeline Workflow Diagram -->
  <g transform="translate(40, 50)">
    <!-- Stage 1: Reviews Data & DVC -->
    <rect x="0" y="30" width="105" height="90" rx="10" fill="#22252C" stroke="#333946" stroke-width="1.5"/>
    <circle cx="52" cy="55" r="14" fill="#1B1E24" stroke="#FFDB6E" stroke-width="1.5"/>
    <text x="52" y="59" fill="#FFDB6E" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" text-anchor="middle">8.5k</text>
    <text x="52" y="86" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Reviews Ingestion</text>
    <text x="52" y="103" fill="#888899" font-family="'Poppins', sans-serif" font-size="9" text-anchor="middle">DVC Versioned</text>

    <!-- Arrow 1 -->
    <path d="M110 75 H135" stroke="#FFDB6E" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="135,71 142,75 135,79" fill="#FFDB6E"/>

    <!-- Stage 2: Prefect Daily Retraining -->
    <rect x="145" y="20" width="115" height="110" rx="12" fill="#252A34" stroke="url(#mlopsGrad)" stroke-width="2"/>
    <rect x="160" y="32" width="85" height="18" rx="9" fill="#FFDB6E" fill-opacity="0.15"/>
    <text x="202" y="45" fill="#FFDB6E" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">PREFECT FLOW</text>
    <text x="202" y="75" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Automated</text>
    <text x="202" y="90" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Daily Retrain</text>
    <text x="202" y="112" fill="#00E599" font-family="'Poppins', sans-serif" font-size="9" text-anchor="middle">ΓùÅ Scheduled Daily</text>

    <!-- Arrow 2 -->
    <path d="M265 75 H290" stroke="#FFDB6E" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="290,71 297,75 290,79" fill="#FFDB6E"/>

    <!-- Stage 3: MLflow & Optuna -->
    <rect x="300" y="30" width="105" height="90" rx="10" fill="#22252C" stroke="#333946" stroke-width="1.5"/>
    <text x="352" y="55" fill="#4E82EE" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" text-anchor="middle">MLflow</text>
    <text x="352" y="75" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Optuna Tuning</text>
    <text x="352" y="95" fill="#888899" font-family="'Poppins', sans-serif" font-size="8.5" text-anchor="middle">Experiment Track</text>
    <text x="352" y="108" fill="#888899" font-family="'Poppins', sans-serif" font-size="8.5" text-anchor="middle">Model Registry</text>

    <!-- Arrow 3 -->
    <path d="M410 75 H435" stroke="#FFDB6E" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="435,71 442,75 435,79" fill="#FFDB6E"/>

    <!-- Stage 4: FastAPI REST on AWS -->
    <rect x="445" y="30" width="105" height="90" rx="10" fill="#22252C" stroke="#333946" stroke-width="1.5"/>
    <circle cx="497" cy="53" r="12" fill="#00D26A" fill-opacity="0.15" stroke="#00D26A" stroke-width="1.5"/>
    <path d="M493 53 L496 56 L502 49" stroke="#00E599" stroke-width="2" stroke-linecap="round"/>
    <text x="497" y="80" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" text-anchor="middle">FastAPI REST</text>
    <text x="497" y="96" fill="#888899" font-family="'Poppins', sans-serif" font-size="8.5" text-anchor="middle">AWS Serving</text>
    <text x="497" y="108" fill="#00E599" font-family="'Poppins', sans-serif" font-size="8.5" text-anchor="middle">Live Endpoint</text>
  </g>

  <!-- Project Info Footer -->
  <rect x="30" y="240" width="540" height="110" rx="12" fill="#1C1C21" stroke="#303038" stroke-width="1"/>
  <text x="50" y="272" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="17" font-weight="600">Yonex Sentiment MLOps Pipeline</text>
  <text x="50" y="295" fill="#AAAAAA" font-family="'Poppins', sans-serif" font-size="12">End-to-end MLOps across 8,500+ reviews: automated Prefect retraining, MLflow logging &amp; FastAPI serving</text>

  <!-- Stack Pills -->
  <g transform="translate(50, 312)">
    <rect x="0" y="0" width="75" height="24" rx="12" fill="#2C2C35"/>
    <text x="37" y="16" fill="#FFDB6E" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">MLflow</text>

    <rect x="85" y="0" width="75" height="24" rx="12" fill="#2C2C35"/>
    <text x="122" y="16" fill="#E0E0E0" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">Prefect</text>

    <rect x="170" y="0" width="75" height="24" rx="12" fill="#2C2C35"/>
    <text x="207" y="16" fill="#E0E0E0" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">Optuna</text>

    <rect x="255" y="0" width="70" height="24" rx="12" fill="#2C2C35"/>
    <text x="290" y="16" fill="#E0E0E0" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">FastAPI</text>

    <rect x="335" y="0" width="55" height="24" rx="12" fill="#2C2C35"/>
    <text x="362" y="16" fill="#E0E0E0" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">DVC</text>

    <rect x="400" y="0" width="145" height="24" rx="12" fill="#2C2C35"/>
    <text x="472" y="16" fill="#00E599" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">100% Reproducible</text>
  </g>
</svg>
